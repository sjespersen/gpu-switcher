name: image
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the code and the page scripts
        run: |
          python3 -m py_compile app.py
          for page in PAGE LOGIN; do
            API_KEY=x python3 -c 'import re, sys, app; print("\n".join(re.findall(r"<script>(.*?)</script>", getattr(app, sys.argv[1]), re.S)))' $page >/tmp/$page.js
            node --check /tmp/$page.js
          done
      - name: Check the local setup
        run: |
          shellcheck local/local-ai
          printf 'API_KEY=x\nNAME=x\nPORT=8005\nSTUDIO_PORT=8008\nIDLE_MINUTES=30\nSTATE_DIR=/s\nMODELS_DIR=/m\nMEDIA_DIR=/d\nCHAT_REPO=r\nCHAT_FILE=f\nCHAT_NAME=n\nCHAT_TITLE=t\nCHAT_CONTEXT=4096\n' >/tmp/local.env
          env UID=1000 GID=1000 TZ=UTC docker compose --env-file /tmp/local.env -f local/compose.yaml --profile '*' config -q
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      # Built on every push; published only for a version tag (v1.2.3).
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
